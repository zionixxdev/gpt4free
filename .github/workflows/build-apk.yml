name: Build Android APK

# Builds the g4f Android app (Gradle + Chaquopy) on GitHub's servers and
# uploads the debug APK as a downloadable artifact, so you can build and grab
# the APK entirely from a phone.
#
# The g4f Python package is not committed to this repo; the build fetches it
# from upstream and drops it at ./g4f, which is where the app's copyG4fAssets
# task expects it.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # start a build by hand from the Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already ships the Android SDK; this makes sure
      # the exact platform/build-tools this project needs are present.
      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Fetch g4f Python package
        run: |
          git clone --depth 1 https://github.com/xtekky/gpt4free.git _g4f_src
          cp -r _g4f_src/g4f ./g4f
          rm -rf _g4f_src

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: g4f-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
